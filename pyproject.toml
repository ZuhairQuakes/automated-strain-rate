[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-strain-rate"
version = "0.2.0"
description = "Reproducible GNSS strain-rate estimation and experimental anomaly investigation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohd Zuhair" }]
keywords = ["geodesy", "gnss", "natural-hazards", "strain-rate", "tectonics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "xarray>=2024.1,<2027",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.8,<1"]
investigation = ["matplotlib>=3.8,<4", "pyproj>=3.6,<4"]
notebook = ["cartopy>=0.23,<1", "jupyterlab>=4,<5", "matplotlib>=3.8,<4", "netcdf4>=1.7,<2"]

[project.scripts]
strain-rate = "automated_strain_rate.cli:main"

[project.urls]
Changelog = "https://github.com/ZuhairQuakes/automated-strain-rate/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ZuhairQuakes/automated-strain-rate#readme"
Issues = "https://github.com/ZuhairQuakes/automated-strain-rate/issues"
Repository = "https://github.com/ZuhairQuakes/automated-strain-rate"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
