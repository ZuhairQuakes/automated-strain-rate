name: Bug report
description: Report an incorrect result, crash, or reproducibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Include the command, parameters, and a shareable input if possible.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Software, Python, and GMT versions
    validations:
      required: true
